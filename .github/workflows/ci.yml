name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LLVM_VERSION: '21.1.8'
  LLVM_TAG: llvmorg-21.1.8
  ACTION_FORCE_LINK: true
  LINUX_TARGET: x86_64-unknown-linux-gnu

jobs:
  # ── Linux: 4 parallel self-hosted jobs (need ≥4 idle runners) ─────────────
  # Wall time ≈ max(test, clippy, frontend, benchmark), not their sum.

  linux-test:
    name: Linux Test
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.LINUX_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64
          key: test
          cache-bin: false
          save-if: ${{ github.job == 'linux-test' }}
      - name: Format check
        run: cargo fmt -- --check
      - name: Build, smoke, lib & integration tests
        env:
          PROPTEST_CASES: '50'
        run: nix-shell --run "bash scripts/ci-linux.sh test"
      - name: Debug run output
        if: failure()
        run: nix-shell --run "bash scripts/ci-linux.sh debug" 2>&1 | tee action_run_output.txt
      - name: Upload run output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-output-linux-test-${{ github.run_id }}
          path: action_run_output.txt

  linux-clippy:
    name: Linux Clippy
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.LINUX_TARGET }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64
          key: clippy
          cache-bin: false
          save-if: false
      - name: Clippy
        run: nix-shell --run "bash scripts/ci-linux.sh clippy"

  linux-frontend:
    name: Linux Frontend
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.LINUX_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64
          key: frontend
          cache-bin: false
          save-if: false
      - name: action-frontend build & test
        run: nix-shell --run "bash scripts/ci-linux.sh frontend"

  linux-benchmark:
    name: Linux Benchmark
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.LINUX_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64
          key: benchmark
          cache-bin: false
          save-if: false
      - name: Benchmark
        run: nix-shell --run "bash scripts/ci-linux.sh benchmark"
      - name: Check AOT benchmark regression
        continue-on-error: true
        run: python3 scripts/benchmark_regression.py benchmark_results_aot_o2.txt benchmark_results_aot_o2_ci.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmark_results.txt
            benchmark_results_aot_o2_ci.txt

  # ── Windows: single job (avoid duplicate LLVM setup + build) ───────────────
  windows:
    name: Windows CI
    runs-on: windows-2025
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Cache LLVM (Windows)
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-${{ env.TARGET }}

      - name: Download LLVM (Windows)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $URL = "https://github.com/llvm/llvm-project/releases/download/${{ env.LLVM_TAG }}/clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz"
          Write-Host "Downloading $URL"
          curl.exe -fSL --retry 3 --connect-timeout 30 -o C:\llvm.tar.xz "$URL"
          Write-Host "Extracting..."
          New-Item -Force -ItemType Directory -Path C:\llvm-extract | Out-Null
          tar -xf C:\llvm.tar.xz -C C:\llvm-extract
          Remove-Item C:\llvm.tar.xz -Force
          $innerDir = Get-ChildItem C:\llvm-extract -Directory | Select-Object -First 1
          if ($innerDir) {
            Move-Item $innerDir.FullName C:\llvm -Force
          } else {
            Rename-Item C:\llvm-extract C:\llvm -Force
          }
          Remove-Item C:\llvm-extract -Recurse -Force -ErrorAction SilentlyContinue

      - name: Set LLVM env (Windows)
        shell: pwsh
        run: |
          echo "LLVM_SYS_211_PREFIX=C:\llvm" >> $env:GITHUB_ENV
          echo "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create libxml2 stub (Windows)
        shell: pwsh
        run: |
          $libExe = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter "lib.exe" -Depth 8 -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "x64" -and $_.Directory.Parent.Name -eq "HostX64" } | Select-Object -First 1
          if (-not $libExe) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -property installationPath
              $libExe = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter "lib.exe" -Depth 4 -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "x64" -and $_.Directory.Parent.Name -eq "HostX64" } | Select-Object -First 1
            }
          }
          if (-not $libExe) { throw "Cannot find lib.exe" }
          "LIBRARY libxml2`nEXPORTS" | Out-File -Encoding ASCII C:\llvm\lib\libxml2s.def
          & $libExe.FullName /DEF:C:\llvm\lib\libxml2s.def /OUT:C:\llvm\lib\libxml2s.lib /MACHINE:X64
          Remove-Item C:\llvm\lib\libxml2s.def -Force

      - name: Build
        run: cargo build --target ${{ env.TARGET }}

      - name: Check examples/hello.at
        shell: bash
        run: |
          ACTION="target/${{ env.TARGET }}/debug/action.exe"
          "$ACTION" check examples/hello.at

      - name: Run examples/hello.at
        shell: bash
        run: |
          ACTION="target/${{ env.TARGET }}/debug/action.exe"
          OUTPUT="$("$ACTION" run examples/hello.at 2>&1)"
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -qi "hello"; then
            echo "::warning::'hello.at' run output did not contain expected output"
          fi

      - name: LSP smoke test
        shell: bash
        run: |
          ACTION="target/${{ env.TARGET }}/debug/action.exe"
          timeout 5 "$ACTION" lsp < /dev/null 2>&1 && true

      - name: Test lib
        env:
          PROPTEST_CASES: '50'
        run: cargo test --lib --target ${{ env.TARGET }} -- --test-threads=1

      - name: Integration tests
        run: cargo test --test integration --target ${{ env.TARGET }} -- --test-threads=1

      - name: Debug run output
        if: failure()
        shell: pwsh
        run: |
          $action = "target/${{ env.TARGET }}/debug/action.exe"
          & $action run examples/hello.at *>&1 | Tee-Object -FilePath action_run_output.txt

      - name: Upload run output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-output-windows-${{ github.run_id }}
          path: action_run_output.txt
