name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly benchmark regression (P1-2); UTC Monday 02:00
    - cron: '0 2 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: '21.1.8'
  LLVM_TAG: llvmorg-21.1.8
  ACTION_FORCE_LINK: true
  LINUX_TARGET: x86_64-unknown-linux-gnu

jobs:
  # Linux jobs: self-hosted NixOS runners; all build/test steps run inside nix-shell (shell.nix).
  linux:
    name: Linux CI
    runs-on: [self-hosted, linux, ci]
    env:
      CARGO_TARGET_DIR: /home/miaox99/桌面/Runner/ci-target
      CARGO_INCREMENTAL: 1
      CARGO_BUILD_JOBS: 16
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout repository
        run: bash scripts/checkout-codeload.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.LINUX_TARGET }}
          components: rustfmt

      - name: Ensure persistent target dir
        run: mkdir -p "$CARGO_TARGET_DIR"

      - name: Format check
        run: cargo fmt -- --check

      - name: Core CI (single nix-shell)
        env:
          PROPTEST_CASES: '50'
          TARGET: ${{ env.LINUX_TARGET }}
        run: nix-shell --run "bash scripts/ci-linux.sh core"

      - name: Debug run output
        if: failure()
        run: nix-shell --run "bash scripts/ci-linux.sh debug" 2>&1 | tee action_run_output.txt

      - name: Upload run output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-output-linux-${{ github.run_id }}
          path: action_run_output.txt

  proptest:
    name: Linux Proptest
    runs-on: [self-hosted, linux, ci]
    env:
      CARGO_TARGET_DIR: /home/miaox99/桌面/Runner/ci-target
      CARGO_INCREMENTAL: 1
      CARGO_BUILD_JOBS: 16
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout repository
        run: bash scripts/checkout-codeload.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.LINUX_TARGET }}

      - name: Ensure persistent target dir
        run: mkdir -p "$CARGO_TARGET_DIR"

      - name: Frontend proptest
        env:
          PROPTEST_CASES: '256'
          TARGET: ${{ env.LINUX_TARGET }}
        run: nix-shell --run "bash scripts/ci-linux.sh proptest"

  benchmark:
    name: Linux Benchmark
    # Dedicated runner-6; parallel with linux/windows (wall ≈ max of the three).
    runs-on: [self-hosted, linux, benchmark]
    env:
      # Separate from ci-target: linux + benchmark jobs run in parallel on one host.
      CARGO_TARGET_DIR: /home/miaox99/桌面/Runner/ci-target-benchmark
      CARGO_INCREMENTAL: 1
      CARGO_BUILD_JOBS: 16
    steps:
      - name: Checkout repository
        run: bash scripts/checkout-codeload.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.LINUX_TARGET }}

      - name: Ensure persistent target dir
        run: mkdir -p "$CARGO_TARGET_DIR"

      - name: Full benchmark (JIT + AOT)
        env:
          TARGET: ${{ env.LINUX_TARGET }}
        run: nix-shell --run "bash scripts/ci-linux.sh benchmark"

      - name: Check AOT benchmark regression
        run: python3 scripts/benchmark_regression.py benchmark_results_aot_o2.txt benchmark_results_aot_o2_ci.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmark_results.txt
            benchmark_results_aot_o2_ci.txt

  windows:
    name: Windows CI
    runs-on: windows-2025
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Cache LLVM (Windows)
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-${{ env.TARGET }}

      - name: Download LLVM (Windows)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $URL = "https://github.com/llvm/llvm-project/releases/download/${{ env.LLVM_TAG }}/clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz"
          curl.exe -fSL --retry 3 --connect-timeout 30 -o C:\llvm.tar.xz "$URL"
          New-Item -Force -ItemType Directory -Path C:\llvm-extract | Out-Null
          tar -xf C:\llvm.tar.xz -C C:\llvm-extract
          Remove-Item C:\llvm.tar.xz -Force
          $innerDir = Get-ChildItem C:\llvm-extract -Directory | Select-Object -First 1
          if ($innerDir) { Move-Item $innerDir.FullName C:\llvm -Force }
          else { Rename-Item C:\llvm-extract C:\llvm -Force }
          Remove-Item C:\llvm-extract -Recurse -Force -ErrorAction SilentlyContinue

      - name: Set LLVM env (Windows)
        shell: pwsh
        run: |
          echo "LLVM_SYS_211_PREFIX=C:\llvm" >> $env:GITHUB_ENV
          echo "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create libxml2 stub (Windows)
        shell: pwsh
        run: |
          $libExe = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter "lib.exe" -Depth 8 -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "x64" -and $_.Directory.Parent.Name -eq "HostX64" } | Select-Object -First 1
          if (-not $libExe) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -property installationPath
              $libExe = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter "lib.exe" -Depth 4 -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "x64" -and $_.Directory.Parent.Name -eq "HostX64" } | Select-Object -First 1
            }
          }
          if (-not $libExe) { throw "Cannot find lib.exe" }
          "LIBRARY libxml2`nEXPORTS" | Out-File -Encoding ASCII C:\llvm\lib\libxml2s.def
          & $libExe.FullName /DEF:C:\llvm\lib\libxml2s.def /OUT:C:\llvm\lib\libxml2s.lib /MACHINE:X64
          Remove-Item C:\llvm\lib\libxml2s.def -Force

      - name: Build
        run: cargo build --target ${{ env.TARGET }}

      - name: Smoke & tests
        shell: pwsh
        env:
          PROPTEST_CASES: '50'
        run: |
          $Action = Join-Path $PWD "target/$env:TARGET/debug/action.exe"
          if (-not (Test-Path $Action)) { throw "missing binary: $Action" }
          & $Action check examples/hello.ac
          $out = & $Action run examples/hello.ac 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'hello') { Write-Warning "hello.ac output unexpected" }
          try { '{}' | & $Action lsp 2>&1 | Out-Null } catch { Write-Host "lsp smoke: $_" }
          cargo test --lib --target $env:TARGET -- --test-threads=1 --skip proptest
          cargo test --test integration --target $env:TARGET -- --test-threads=1
          cargo build --release --target $env:TARGET
          $Release = Join-Path $PWD "target/$env:TARGET/release/action.exe"
          if (-not (Test-Path $Release)) { throw "missing release binary: $Release" }
          $cow = & $Release run examples/bench_cow.ac 2>&1 | Out-String
          if ($cow.Trim().Split("`n")[-1] -ne '11') { throw "bench_cow (release): expected 11" }
          & $Release run examples/test_insert_exit.ac | Out-Null
          & $Release run examples/bench_all.ac | Out-Null
          & $Release run examples/test_list_alias_insert.ac | Out-Null

      - name: Debug run output
        if: failure()
        shell: pwsh
        run: |
          $action = Join-Path $PWD "target/$env:TARGET/debug/action.exe"
          if (Test-Path $action) {
            & $action run examples/hello.ac *>&1 | Tee-Object -FilePath action_run_output.txt
          } else {
            "binary missing: $action" | Tee-Object -FilePath action_run_output.txt
          }

      - name: Upload run output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-output-windows-${{ github.run_id }}
          path: action_run_output.txt
