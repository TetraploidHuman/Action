name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false
        default: ''

env:
  LLVM_VERSION: '21.1.8'
  LLVM_TAG: llvmorg-21.1.8

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: self-hosted
            target: x86_64-unknown-linux-gnu
            arch: x64
            ext: tar.gz

          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
            ext: zip
            llvm_archive: clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: ver
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            echo "value=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Windows'
        with:
          key: ${{ matrix.name }}

      # ── LLVM cache (Windows) ──────────────────────────
      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.target }}

      - name: Verify nix-shell (Linux)
        if: runner.os == 'Linux'
        run: |
          test -f shell.nix || { echo "::error::shell.nix not found"; exit 1; }
          nix-shell --run "echo 'LLVM:' && llvm-config --version && echo 'Rust:' && rustc --version"

      - name: Download LLVM (Windows)
        if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $URL = "https://github.com/llvm/llvm-project/releases/download/${{ env.LLVM_TAG }}/${{ matrix.llvm_archive }}"
          Write-Host "Downloading $URL"
          curl.exe -fSL --retry 3 --connect-timeout 30 -o C:\llvm.tar.xz "$URL"
          Write-Host "Extracting..."
          New-Item -Force -ItemType Directory -Path C:\llvm-extract | Out-Null
          tar -xf C:\llvm.tar.xz -C C:\llvm-extract
          Remove-Item C:\llvm.tar.xz -Force
          $innerDir = Get-ChildItem C:\llvm-extract -Directory | Select-Object -First 1
          if ($innerDir) {
            Move-Item $innerDir.FullName C:\llvm -Force
          } else {
            Rename-Item C:\llvm-extract C:\llvm -Force
          }
          Remove-Item C:\llvm-extract -Recurse -Force -ErrorAction SilentlyContinue

      - name: Set LLVM env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "LLVM_SYS_211_PREFIX=C:\llvm" >> $env:GITHUB_ENV
          echo "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create libxml2 stub (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libExe = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter "lib.exe" -Depth 8 -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "x64" -and $_.Directory.Parent.Name -eq "HostX64" } | Select-Object -First 1
          if (-not $libExe) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -property installationPath
              $libExe = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter "lib.exe" -Depth 4 -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "x64" -and $_.Directory.Parent.Name -eq "HostX64" } | Select-Object -First 1
            }
          }
          if (-not $libExe) { throw "Cannot find lib.exe" }
          "LIBRARY libxml2`nEXPORTS" | Out-File -Encoding ASCII C:\llvm\lib\libxml2s.def
          & $libExe.FullName /DEF:C:\llvm\lib\libxml2s.def /OUT:C:\llvm\lib\libxml2s.lib /MACHINE:X64
          Remove-Item C:\llvm\lib\libxml2s.def -Force

      # ── Build ─────────────────────────────────────────
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: nix-shell --run "cargo build --release --target ${{ matrix.target }}"

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: nix-shell --run "cargo test --release 2>&1 | tail -5"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        id: pkg-linux
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.value }}"
          PKG="action-${VER}-linux-${{ matrix.arch }}"
          DIR="/tmp/${PKG}"

          mkdir -p "${DIR}/bin" "${DIR}/examples" "${DIR}/lib" "${DIR}/stdlib"

          cp "target/${{ matrix.target }}/release/action" "${DIR}/bin/"
          cp README.md "${DIR}/"
          cp -r examples/* "${DIR}/examples/" 2>/dev/null || true
          cp -r lib/* "${DIR}/lib/" 2>/dev/null || true
          cp -r stdlib/* "${DIR}/stdlib/" 2>/dev/null || true

          strip "${DIR}/bin/action" 2>/dev/null || true

          cd /tmp
          tar czf "${PKG}.tar.gz" "${PKG}"
          echo "file=${PKG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        id: pkg-windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $VER = "${{ steps.ver.outputs.value }}"
          $PKG = "action-${VER}-windows-x64"
          $DIR = "C:\${PKG}"

          New-Item -ItemType Directory -Force -Path "$DIR\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$DIR\examples" | Out-Null
          New-Item -ItemType Directory -Force -Path "$DIR\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$DIR\stdlib" | Out-Null

          Copy-Item "target\${{ matrix.target }}\release\action.exe" -Destination "$DIR\bin\"
          Copy-Item "README.md" -Destination "$DIR\"
          Copy-Item "examples\*" -Destination "$DIR\examples\" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "lib\*" -Destination "$DIR\lib\" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "stdlib\*" -Destination "$DIR\stdlib\" -Recurse -Force -ErrorAction SilentlyContinue

          $archive = "${PKG}.zip"
          Compress-Archive -Path "$DIR" -DestinationPath "C:\${archive}"
          echo "file=${archive}" >> $env:GITHUB_OUTPUT

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: /tmp/${{ steps.pkg-linux.outputs.file }}
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: C:\${{ steps.pkg-windows.outputs.file }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p /tmp/release-assets
          find /tmp/artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} /tmp/release-assets/ \;
          echo "Assets to upload:"
          ls -lh /tmp/release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Atomic v${{ steps.ver.outputs.value }}
          tag_name: ${{ github.ref_name }}
          files: /tmp/release-assets/*
          body: |
            ## Atomic Language Compiler v${{ steps.ver.outputs.value }}

            Pre-built binaries for all supported platforms.

            | Platform | Package |
            |----------|---------|
            | Linux x64 | [action-${{ steps.ver.outputs.value }}-linux-x64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/action-${{ steps.ver.outputs.value }}-linux-x64.tar.gz) |
            | Windows x64 | [action-${{ steps.ver.outputs.value }}-windows-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/action-${{ steps.ver.outputs.value }}-windows-x64.zip) |

            ### Installation
            Extract the archive and add the `bin/` directory to your PATH.

            ```bash
            # Linux
            tar xzf action-${{ steps.ver.outputs.value }}-linux-x64.tar.gz
            export PATH="$PWD/action-${{ steps.ver.outputs.value }}-linux-x64/bin:$PATH"
            action run hello.ac
            ```
          generate_release_notes: true
