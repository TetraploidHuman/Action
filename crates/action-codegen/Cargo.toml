[package]
name = "action-codegen"
version = "0.5.4"
edition = "2021"

build = "build.rs"
publish = false


[dependencies]
action-frontend = { path = "../action-frontend" }
llvm-sys = { version = "211" }

[target.'cfg(windows)'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["llvm21-1", "target-x86"] }

[target.'cfg(not(windows))'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["llvm21-1", "target-x86", "target-aarch64", "target-webassembly"] }
