[workspace]
members = [
    ".",
    "crates/action-span",
    "crates/action-frontend",
    "crates/action-codegen",
    "crates/host-rt",
    "crates/runtime-bc-emit",
]
resolver = "2"

[package]
name = "action"
version = "0.5.2"
edition = "2021"

[lib]
name = "action"
path = "src/lib.rs"

[[bin]]
name = "action"
path = "src/main.rs"

[dependencies]
action-span = { path = "crates/action-span" }
action-frontend = { path = "crates/action-frontend" }
action-codegen = { path = "crates/action-codegen" }
inkwell = { version = "0.9", features = ["llvm21-1"] }
llvm-sys = { version = "211" }
ariadne = "0.4"
clap = { version = "4", features = ["derive"] }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.4"
