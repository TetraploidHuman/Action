[package]
name = "action"
version = "0.1.9"
edition = "2021"

[[bin]]
name = "action"
path = "src/main.rs"

[dependencies]
inkwell = { version = "0.9", features = ["llvm21-1"] }
llvm-sys = { version = "211" }
clap = { version = "4", features = ["derive"] }
ariadne = "0.4"
toml = "1.0"
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
